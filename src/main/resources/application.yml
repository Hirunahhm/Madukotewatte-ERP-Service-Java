spring:
  application:
    name: estate-erp-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estate_erp}
    username: ${DB_USER:estate_user}
    password: ${DB_PASSWORD:estate_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-and-secure-random-secret-key-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  estate:
    latitude: ${ESTATE_LATITUDE:6.916694}
    longitude: ${ESTATE_LONGITUDE:81.298806}
    timezone: ${ESTATE_TIMEZONE:Asia/Colombo}
  weather:
    forecast-url: https://api.open-meteo.com/v1/forecast
    archive-url: https://archive-api.open-meteo.com/v1/archive
    tap-rain-threshold-mm: ${WEATHER_TAP_RAIN_THRESHOLD_MM:1.0}
    tap-rain-probability-max: ${WEATHER_TAP_RAIN_PROBABILITY_MAX:60}
    startup-backfill-days: ${WEATHER_STARTUP_BACKFILL_DAYS:730}
    startup-backfill-enabled: ${WEATHER_STARTUP_BACKFILL_ENABLED:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.madukotawatte: DEBUG
    org.springframework.security: INFO
