name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/madukotawatte-erp/dashboard-frontend && git pull
            cd /opt/madukotawatte-erp/estate-erp-service-java && git pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
